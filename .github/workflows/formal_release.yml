name: Formal Release Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - '**.txt'

concurrency:
  group: formal-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Production-Signed APK
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Verify release source
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/master"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 21
          java-package: jdk
          distribution: temurin
          cache: gradle

      - name: Lint and build unsigned release
        env:
          GLYPH_FORMAL_RELEASE: 'true'
        run: ./gradlew --no-daemon :app:lintRelease :app:assembleRelease

      - name: Sign and verify formal release
        id: release
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          umask 077
          keystore_path="${RUNNER_TEMP}/release.p12"
          trap 'rm -f "$keystore_path"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          unset RELEASE_KEYSTORE_BASE64
          test -s "$keystore_path"
          expected_fingerprint=$(sed -nE \
            's/^project\.app\.signing\.productionCertificateSha256=([0-9a-fA-F]{64})$/\1/p' \
            gradle.properties)
          actual_fingerprint=$(
            keytool -exportcert \
              -alias "$RELEASE_KEY_ALIAS" \
              -keystore "$keystore_path" \
              -storetype PKCS12 \
              -storepass:env RELEASE_STORE_PASSWORD \
            | openssl x509 -inform DER -outform DER \
            | openssl dgst -sha256 -r \
            | cut -d' ' -f1
          )
          test -n "$expected_fingerprint"
          test "${actual_fingerprint,,}" = "${expected_fingerprint,,}"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          build_tools=$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          version_name=$(sed -nE 's/^project\.app\.versionName="?([^"[:space:]]+)"?$/\1/p' gradle.properties)
          test -n "$version_name"
          unsigned_source=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "Glyph-${version_name}.apk" -print -quit)
          test -n "$build_tools"
          test -n "$unsigned_source"
          "$build_tools/zipalign" -c -P 16 4 "$unsigned_source"
          release_target="${RUNNER_TEMP}/Glyph-${version_name}.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore_path" \
            --ks-type PKCS12 \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$release_target" \
            "$unsigned_source"
          unset RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD RELEASE_KEY_ALIAS
          "$build_tools/apksigner" verify --verbose --print-certs "$release_target"
          artifact_dir="${RUNNER_TEMP}/release-artifact"
          mkdir -p "$artifact_dir"
          cp "$release_target" "$artifact_dir/Glyph-${version_name}.apk"
          echo "apk_path=$release_target" >> "$GITHUB_OUTPUT"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload production-signed artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Glyph-release-apk
          path: ${{ steps.release.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 14
